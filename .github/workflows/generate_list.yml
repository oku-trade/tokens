name: Generate Tokenlist
permissions:
  contents: write

concurrency:
  group: generate-tokenlist
  cancel-in-progress: false

on:
  push:
    branches:
      - main

jobs:
  update-tokenlist:
    if: github.repository == 'oku-trade/tokens' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Queued runs need the manifest committed by the previous run.
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Update asset lists
        env:
          CF_SECRET: ${{ secrets.CF_SECRET }}
          CF_KEY: ${{ secrets.CF_KEY }}
        run: make list

      - name: Commit updated asset lists
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          if [ -n "$(git status --porcelain tokenlist.json perpslist.json .upload-manifest.json)" ]; then
            git add tokenlist.json perpslist.json .upload-manifest.json
            git commit -m "chore: update asset lists [skip ci]"
            git push origin main
          else
            echo "No changes in asset lists"
          fi
